/auth/refresh:
  post:
    summary: Refresh access token
    description: Use refresh token to get new access token
    tags:
      - Auth

    security:
      - refreshTokenCookie: []

    responses:
      '200':
        description: New access token
        content:
          application/json:
            schema:
              type: object
              properties:
                accessToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

components:
  securitySchemes:
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: refresh_token

