openapi: 3.0.0
info:
  description: RESTful API supports product management.
  title: Product Management API
  version: 1.0.0
servers:
- description: Dev server
  url: http://localhost
paths:
  /auth/refresh:
    post:
      description: Create new access token from refresh token
      operationId: auth_refresh_post
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_auth_refresh_post_200_response"
          description: Successfully generated new access token
        "401":
          description: Unauthorized - refresh token not valid
        "403":
          description: Forbidden - refresh token is revoked.
      security:
      - cookieAuth: []
      summary: Refresh access token
      tags:
      - Auth
      x-openapi-router-controller: openapi_server.controllers.auth_controller
  /products:
    get:
      description: Retrieve a paginated list of products with optional filtering
      operationId: products_get
      parameters:
      - description: Page number starting from 1
        explode: true
        in: query
        name: page
        required: false
        schema:
          example: 1
          minimum: 1
          type: integer
        style: form
      - description: Number of items per page
        explode: true
        in: query
        name: limit
        required: false
        schema:
          example: 10
          maximum: 20
          minimum: 1
          type: integer
        style: form
      - description: Filter products by category
        explode: true
        in: query
        name: category
        required: false
        schema:
          example: Electronics
          type: string
        style: form
      - description: Search products by name
        explode: true
        in: query
        name: search
        required: false
        schema:
          example: iPhone
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListItem"
          description: Product list
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized (missing or invalid token)
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Get list of products
      tags:
      - Products
      x-openapi-router-controller: openapi_server.controllers.products_controller
    post:
      description: Add a new product into the system
      operationId: products_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
          description: Product created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized (missing or invalid token)
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      security:
      - bearerAuth: []
      summary: Create a new product
      tags:
      - Products
      x-openapi-router-controller: openapi_server.controllers.products_controller
  /products/{id}:
    delete:
      description: Delete a product by id
      operationId: products_id_delete
      parameters:
      - description: Product id
        explode: false
        in: path
        name: id
        required: true
        schema:
          example: 1
          minimum: 1
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_products__id__delete_200_response"
          description: Product deleted successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Resource not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      security:
      - bearerAuth: []
      summary: Delete product
      tags:
      - Products
      x-openapi-router-controller: openapi_server.controllers.products_controller
    get:
      description: Retrieve detailed information of a product by id
      operationId: products_id_get
      parameters:
      - description: Product id
        explode: false
        in: path
        name: id
        required: true
        schema:
          example: 1
          minimum: 1
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
          description: Successfully retrieved product detail
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized (missing or invalid token)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Resource not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Get product by id
      tags:
      - Products
      x-openapi-router-controller: openapi_server.controllers.products_controller
    put:
      description: Update full info of a product
      operationId: products_id_put
      parameters:
      - description: Product id
        explode: false
        in: path
        name: id
        required: true
        schema:
          example: 1
          minimum: 1
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
          description: Product updated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Resource not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      security:
      - bearerAuth: []
      summary: Update product
      tags:
      - Products
      x-openapi-router-controller: openapi_server.controllers.products_controller
  /users:
    get:
      operationId: users_get
      parameters:
      - description: Enable debug mode
        explode: true
        in: cookie
        name: debug
        required: false
        schema:
          default: 0
          enum:
          - 0
          - 1
          type: integer
        style: form
      - description: UI theme preference
        explode: true
        in: cookie
        name: theme
        required: false
        schema:
          enum:
          - light
          - dark
          type: string
        style: form
      responses:
        "200":
          description: OK
      summary: Get users with debug mode
      tags:
      - Users
      x-openapi-router-controller: openapi_server.controllers.users_controller
components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Bad request
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Unauthorized (missing or invalid token)
    Forbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Forbidden
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Resource not found
    InternalServerError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Internal server error
  schemas:
    ProductBase:
      example:
        price: 999.99
        name: iPhone 20
        description: The latest iPhone with amazing features.
        stock: 100
        category: Electronics
      properties:
        name:
          example: iPhone 20
          title: name
          type: string
        description:
          example: The latest iPhone with amazing features.
          title: description
          type: string
        price:
          example: 999.99
          format: float
          minimum: 0
          title: price
          type: number
        stock:
          example: 100
          minimum: 0
          title: stock
          type: integer
        category:
          example: Electronics
          title: category
          type: string
      required:
      - category
      - description
      - name
      - price
      title: ProductBase
      type: object
    Product:
      allOf:
      - $ref: "#/components/schemas/ProductBase"
      - properties:
          id:
            example: jsdfasdfsdjfhdsh
            type: string
          createdAt:
            example: 2024-01-01T12:00:00Z
            format: date-time
            type: string
          updatedAt:
            example: 2024-01-10T15:30:00Z
            format: date-time
            type: string
        required:
        - id
        type: object
      example:
        createdAt: 2024-01-01T12:00:00Z
        price: 999.99
        name: iPhone 20
        description: The latest iPhone with amazing features.
        id: jsdfasdfsdjfhdsh
        stock: 100
        category: Electronics
        updatedAt: 2024-01-10T15:30:00Z
      title: Product
    ProductListItem:
      example:
        metadata:
          total: 1000
          limit: 10
          page: 1
        data:
        - createdAt: 2024-01-01T12:00:00Z
          price: 999.99
          name: iPhone 20
          description: The latest iPhone with amazing features.
          id: jsdfasdfsdjfhdsh
          stock: 100
          category: Electronics
          updatedAt: 2024-01-10T15:30:00Z
        - createdAt: 2024-01-01T12:00:00Z
          price: 999.99
          name: iPhone 20
          description: The latest iPhone with amazing features.
          id: jsdfasdfsdjfhdsh
          stock: 100
          category: Electronics
          updatedAt: 2024-01-10T15:30:00Z
      properties:
        data:
          items:
            $ref: "#/components/schemas/Product"
          title: data
          type: array
        metadata:
          $ref: "#/components/schemas/ProductListItem_metadata"
      title: ProductListItem
      type: object
    ProductCreateRequest:
      $ref: "#/components/schemas/ProductBase"
    ProductUpdateRequest:
      $ref: "#/components/schemas/ProductBase"
    MessageResponse:
      properties:
        message:
          example: Product deleted successfully
          type: string
      required:
      - message
      type: object
    ApiError:
      example:
        code: 400
        details: Invalid product data
        message: Bad Request
      properties:
        code:
          example: 400
          title: code
          type: integer
        message:
          example: Bad Request
          title: message
          type: string
        details:
          example: Invalid product data
          title: details
          type: string
      required:
      - code
      - message
      title: ApiError
      type: object
    ErrorResponse:
      example:
        error:
          code: 400
          details: Invalid product data
          message: Bad Request
      properties:
        error:
          $ref: "#/components/schemas/ApiError"
      required:
      - error
      title: ErrorResponse
      type: object
    _products__id__delete_200_response:
      example:
        message: Product deleted successfully
      properties:
        message:
          example: Product deleted successfully
          title: message
          type: string
      title: _products__id__delete_200_response
      type: object
    _auth_refresh_post_200_response:
      example:
        accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      properties:
        accessToken:
          description: New JWT access token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          title: accessToken
          type: string
      title: _auth_refresh_post_200_response
      type: object
    ProductListItem_metadata:
      example:
        total: 1000
        limit: 10
        page: 1
      properties:
        page:
          example: 1
          title: page
          type: integer
        limit:
          example: 10
          title: limit
          type: integer
        total:
          example: 1000
          title: total
          type: integer
      required:
      - limit
      - page
      - total
      title: ProductListItem_metadata
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
      x-bearerInfoFunc: openapi_server.controllers.security_controller.info_from_bearerAuth
    cookieAuth:
      in: cookie
      name: refresh_token
      type: apiKey
      x-apikeyInfoFunc: openapi_server.controllers.security_controller.info_from_cookieAuth
