openapi: 3.0.0
info:
  title: Product Management API
  description: RESTful API supports product management.
  version: 1.0.0

servers:
  - url: http://localhost
    description: Dev server 

paths:
  /products:
    get:
      summary: Get list of products
      description: Retrieve a paginated list of products with optional filtering
      tags:
        - Products
      parameters:
        - name: page
          in: query
          description: Page number starting from 1
          required: false
          schema:
            type: integer
            minimum: 1
            example: 1

        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            example: 10

        - name: category
          in: query
          description: Filter products by category
          required: false
          schema:
            type: string
            example: Electronics

        - name: search
          in: query
          description: Search products by name
          required: false
          schema:
            type: string
            example: iPhone

      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Create a new product
      description: Add a new product into the system
      tags:
        - Products
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /products/{id}:
    get:
      summary: Get product by id
      description: Retrieve detailed information of a product by id
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          description: Product id
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        '200':
          description: Successfully retrieved product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'   
        '404':
          $ref: '#/components/responses/NotFound' 
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Update product
      description: Update full info of a product
      tags:
        - Products
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Product id
          schema:
            type: integer
            minimum: 1
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Delete product
      description: Delete a product by id
      tags:
        - Products
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Product id
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        '200':
          description: Product deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Product deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users:
    get:
      summary: Get users with debug mode
      tags:
        - Users
      parameters:
        - name: debug
          in: cookie
          required: false
          schema:
            type: integer
            enum: [0, 1]
            default: 0
          description: Enable debug mode

        - name: theme
          in: cookie
          required: false
          schema:
            type: string
            enum: [light, dark]
          description: UI theme preference
      responses:
        '200':
          description: OK

  /auth/refresh:
    post:
      summary: Refresh access token
      description: Create new access token from refresh token
      tags:
        - Auth
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Successfully generated new access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    description: New JWT access token
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Unauthorized - refresh token not valid
        '403':
          description: Forbidden - refresh token is revoked.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

    cookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token

  schemas:
    ProductBase:
      type: object
      required: 
        - name
        - description
        - price
        - category
      properties:
        name:
          type: string
          example: iPhone 20
        description:
          type: string
          example: The latest iPhone with amazing features.
        price:
          type: number
          format: float
          minimum: 0
          example: 999.99
        stock:
          type: integer
          minimum: 0
          example: 100
        category:
          type: string
          example: Electronics
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductBase'
        - type: object
          required:
            - id 
          properties:
            id:
              type: string
              example: "jsdfasdfsdjfhdsh"
            createdAt:
              type: string
              format: date-time
              example: 2024-01-01T12:00:00Z
            updatedAt:
              type: string
              format: date-time
              example: 2024-01-10T15:30:00Z
    ProductListItem:    
      type: object
      properties:   
        data: 
          type: array
          items:
            $ref: '#/components/schemas/Product'
        metadata:
          type: object
          required:
            - page
            - limit
            - total
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 10
            total:
              type: integer
              example: 1000

    ProductCreateRequest:
      $ref: '#/components/schemas/ProductBase'

    ProductUpdateRequest:
      $ref: '#/components/schemas/ProductBase'
    
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Product deleted successfully
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: Bad Request
        details:
          type: string
          example: Invalid product data

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ApiError'

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      
    Unauthorized:
      description: Unauthorized (missing or invalid token)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    